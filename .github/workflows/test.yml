# Build, typecheck and test on pull requests and on branches other than main. Main is covered by
# publish.yml, which runs the same steps before it publishes.
name: Test

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: comical-opds-bridges

      - uses: actions/checkout@v4
        with:
          repository: porksphere/comical
          path: comical

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install comical deps
        working-directory: comical
        run: bun install --frozen-lockfile

      - name: Build, typecheck, test
        working-directory: comical-opds-bridges
        run: |
          bun install
          bun run build
          bun run typecheck
          bun test
